
name: RAG Application CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.3.5 httpx==0.27.2

      - name: Run backend tests
        working-directory: backend
        env:
          OLLAMA_URL: http://localhost:11434
          MODEL_NAME: llama3.2:1b
          EMBED_MODEL: nomic-embed-text
          MAX_RESULTS: "5"
          CONFIDENCE_THRESHOLD: "0.65"
          DEBUG: "false"
        run: |
          python -m pytest tests/ -v

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t rag-backend:ci ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t rag-frontend:ci ./frontend

      - name: Verify Docker images exist
        run: |
          docker image inspect rag-backend:ci
          docker image inspect rag-frontend:ci
          echo "Both Docker images built successfully."
