
name: fantasy-rag-assistant

services:

  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    depends_on:
      ollama:
        condition: service_started

    volumes:
      - chroma_data:/app/chroma_data

    restart: unless-stopped

  # ==========================================
  # Streamlit Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

  # ==========================================
  # Ollama - Local AI Models
  # ==========================================
  ollama:
    image: ollama/ollama:latest

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

# ==========================================
# Persistent Docker Volumes
# ==========================================
volumes:
  chroma_data:
  ollama_data:
